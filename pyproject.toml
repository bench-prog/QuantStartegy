[project]
name = "quantstrategy"
version = "0.1.0"
description = "基于 NautilusTrader 的量化策略仓库"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
    {name = "cheristerfer"},
]
keywords = ["quant", "trading", "nautilus-trader", "backtest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "nautilus_trader>=1.226,<2",
    "pandas>=2.0",
    "numpy>=2.0",
    "pyarrow>=15.0",
    "influxdb-client>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "ruff>=0.9.0",
    "mypy>=1.15.0",
    "pre-commit>=4.0",
]

[project.scripts]
quant = "scripts.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ── Ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
]
ignore = [
    "E501",  # line too long — handled by formatter
]

[tool.ruff.lint.per-file-ignores]
# Legacy strategy files: framework callbacks often have unused args (ARG002)
# and skeleton code has unused local variables (F841)
"strategies/**/*.py" = ["ARG002", "F841"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ── mypy ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
exclude = [
    "^scripts/",
    "^data/",
]

[[tool.mypy.overrides]]
module = [
    "nautilus_trader.*",
    "pandas.*",
    "pyarrow.*",
    "influxdb_client.*",
]
follow_untyped_imports = true

# Skeleton strategy files: allow incomplete type annotations until filled in.
[[tool.mypy.overrides]]
module = ["strategies.*"]
disable_error_code = ["no-untyped-def", "type-arg", "no-any-return", "misc", "union-attr"]

# Test fixtures: return types are optional for brevity.
[[tool.mypy.overrides]]
module = ["tests.*"]
disable_error_code = ["no-untyped-def"]

# ── pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
    "-p no:warnings",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

# ── coverage ────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["strategies", "grafana"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
